<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CRP India — Civic Reporting Platform. Official portal for citizen grievance reporting and municipal resolution." />
    <title>CRP India — Civic Reporting Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const path = window.location.pathname;
          if (path === '/' || path === '/select-role') {
            document.documentElement.setAttribute('data-theme', 'dark');
            const meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.setAttribute('content', 'dark');
            return;
          }
          const savedTheme = localStorage.getItem('crp_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const activeTheme = savedTheme || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', activeTheme);
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', activeTheme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
